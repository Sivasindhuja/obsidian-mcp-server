[project]
name = "mcp-obsidian-sindhutsundupalli"
version = "0.3.0"
description = "MCP server to work with Obsidian via the Local REST API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Siva Sindhuja", email = "sindhutsundupalli@gmail.com" },
]
keywords = ["obsidian", "mcp", "model-context-protocol", "notes", "rest-api"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Libraries",
]
dependencies = [
  "fastmcp>=3.4,<4",
  "httpx>=0.27,<1",
  "mcp>=1.24,<2",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "respx>=0.21,<1",
  "ruff>=0.8,<1",
]

[project.urls]
Homepage = "https://github.com/Sivasindhuja/obsidian-mcp-server"
Repository = "https://github.com/Sivasindhuja/obsidian-mcp-server"
Issues = "https://github.com/Sivasindhuja/obsidian-mcp-server/issues"

[project.scripts]
mcp-obsidian = "mcp_obsidian.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_obsidian"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
